<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wayfarer Price Check</title>
</head>
<body>
  <!--
    ADR-0005: Browser Tool's mock price-check site. A candidate's Live price
    is computed entirely client-side from the candidateId/city query params,
    using this page's own base-amount table and PRNG seed — independent of
    Gateway's mock catalog (issue #3/#15) — so it can diverge from that
    candidate's Quoted price. BrowserToolPriceCheckAdapter reads this
    element's text content as the JSON price it holds against.
  -->
  <pre id="live-price-json">pending</pre>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var candidateId = params.get("candidateId") || "";
      var city = params.get("city") || "";

      var CURRENCY_BY_CITY = { TOKYO: "JPY", PARIS: "EUR", NEW_YORK: "USD" };
      var BASE_AMOUNT_BY_CITY = { TOKYO: 68000, PARIS: 420, NEW_YORK: 340 };

      function seedFrom(text) {
        var hash = 2166136261;
        for (var i = 0; i < text.length; i++) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      var currency = CURRENCY_BY_CITY[city] || "USD";
      var baseAmount = BASE_AMOUNT_BY_CITY[city] || 100;
      var random = mulberry32(seedFrom(candidateId));
      var amount = Math.round(baseAmount * (0.75 + random() * 0.75) * 100) / 100;

      document.getElementById("live-price-json").textContent = JSON.stringify({ amount: amount, currency: currency });
    })();
  </script>
</body>
</html>
